name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check src/server.js
      - run: node --check public/app.js
      - run: npm test
      - run: bash -n deploy/bootstrap.sh
      - name: Read-only public DNS snapshot
        run: |
          for name in biodata.health app.biodata.health mood.biodata.health; do
            echo "DNS A $name:"
            if getent ahostsv4 "$name" > /tmp/mood-dns-out; then
              awk '{print $1}' /tmp/mood-dns-out | sort -u
            else
              echo '(unresolved)'
            fi
          done
      - run: docker build -t mood-tracker:test .
