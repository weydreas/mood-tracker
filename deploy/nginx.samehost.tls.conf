# Final TLS vhost for a SAME-HOST existing Nginx gateway.
# Activated only after a successful ACME HTTP-01 issuance.
server {
    listen 80;
    server_name mood.biodata.health;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mood-tracker-acme;
        default_type "text/plain";
    }
    location / {
        return 301 https://mood.biodata.health$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name mood.biodata.health;
    ssl_certificate /etc/letsencrypt/live/mood.biodata.health/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mood.biodata.health/privkey.pem;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        client_max_body_size 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
