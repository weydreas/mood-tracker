# Temporary HTTP-only ACME host for FIRST certificate issuance.
# Never proxy private health data over plaintext HTTP.
server {
    listen 80;
    server_name mood.biodata.health;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mood-tracker-acme;
        default_type "text/plain";
    }
    location / {
        return 404;
    }
}
