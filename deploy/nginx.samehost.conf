# Use ONLY when the existing public HTTPS gateway (Nginx) is on the same
# machine as the Mood Tracker container. Install first as HTTP; then let
# Certbot's nginx plugin install TLS and HTTPS redirects after DNS is ready.
server {
    listen 80;
    server_name mood.biodata.health;

    access_log off; # avoid retaining sensitive paths or query strings
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
